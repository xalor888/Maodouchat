name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maodouchat_test
          POSTGRES_USER: maodouchat_test
          POSTGRES_PASSWORD: maodouchat_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maodouchat_test -d maodouchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify product terminology
        run: python3 scripts/check-brand-terminology.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Make Gradle wrapper executable
        run: chmod +x ../gradlew
        working-directory: server

      - name: Compile and test server
        run: ../gradlew compileKotlin test --no-daemon --console=plain
        working-directory: server

      - name: Run PostgreSQL concurrency integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: "jdbc:postgresql://127.0.0.1:5432/maodouchat_test?user=maodouchat_test&password=maodouchat_test_password"
        run: ../gradlew postgresIntegrationTest --no-daemon --console=plain
        working-directory: server

      # G21：把 PG 用例的结果 XML 也当工件上传。此前只有「任务绿了」这一条信息——
      # 而任务绿**不等于**用例真的跑了（用例被跳过、被过滤、或根本没进 classpath 时它照样绿）。
      # 有了这份 XML 才能像 androidTest 那样**逐用例**核对数量与失败数。
      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-results
          path: server/build/test-results/postgresIntegrationTest
          if-no-files-found: warn

      # Q06：备份→恢复演练。生产脚本的恢复路径此前从未被真正演练过；这里用 CI 的
      # PostgreSQL 16 service 真跑一遍 dump/restore 往返 + 逐表行数比对 + 坏备份必须被拒绝。
      # 同时它也是「生产备份的完整性检查够不够强」的回归网：脚本若退回只做 --list，
      # 截断/损坏用例会立刻红（--list 抓不到数据块损坏，整档读才行）。
      - name: Rehearse PostgreSQL backup and restore
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: maodouchat_test
          PGPASSWORD: maodouchat_test_password
        run: bash scripts/rehearse-pg-restore.sh

      - name: Install browser E2E dependency
        run: npm ci --ignore-scripts

      - name: Run admin browser E2E
        env:
          APP_ENV: development
          HOST: 127.0.0.1
          PORT: "18080"
          BASE_URL: http://127.0.0.1:18080
          JWT_SECRET: admin-e2e-ci-secret-12345678901234567890
          DATABASE_URL: "jdbc:h2:mem:admin-e2e-ci;DB_CLOSE_DELAY=-1"
          DATABASE_DRIVER: org.h2.Driver
          SEED_DEMO_USERS: "true"
          MODERATOR_EMAILS: alex@example.com
          MASTER_ADMINS: u1
          # 9.221：开发者中心 E2E 需要 u1 在开发者白名单（失败闭合策略）
          DEVELOPER_USER_IDS: u1
          SMTP_HOST: ""
          ADMIN_E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          mkdir -p build/reports
          # 9.244：用 setsid 起进程组——此前 kill 只杀子 shell，gradle run 的 JVM
          # 变孤儿进程占住 18080/内存直到 runner 超时
          setsid bash -c 'cd server && exec ../gradlew run --no-daemon --console=plain > ../build/admin-e2e-server.log 2>&1' &
          SERVER_PID=$!
          trap 'kill -- -"$SERVER_PID" 2>/dev/null || true' EXIT
          npm run test:admin-e2e
          npm run test:website
          npm run test:developer-e2e

      - name: Upload admin E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-e2e
          path: |
            build/reports/admin-e2e.png
            build/admin-e2e-server.log
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # 不再使用 android-actions/setup-android@v4：该 action 的引导会执行
        # `sdkmanager tools`，而 Google 已把 legacy `tools` 包移出主 channel，于是它在
        # 「Set up Android SDK」阶段就直接退出：`Warning: Failed to find package 'tools'`
        # → sdkmanager exit 1。两个 Android job 因此都在任何编译之前失败
        # （2026-09-15 run 34914731652 的 attempt 1 与 attempt 2 均实测复现；
        # attempt 2 在 16 秒内失败，失败步骤就是这一条）。
        # ubuntu-latest 镜像本身已预装 cmdline-tools 与 platform-tools，这里只做
        # 定位与导出，后续步骤继续直接用 `sdkmanager`（不再依赖任何第三方 action）。
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "Android SDK root not found: $sdk_root" >&2; exit 1; }
          cmdline_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n1 || true)"
          if [ -z "$cmdline_bin" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            find "$sdk_root" -maxdepth 2 -type d >&2 || true
            exit 1
          fi
          {
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_HOME=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$(dirname "$cmdline_bin")"
            echo "$sdk_root/platform-tools"
          } >> "$GITHUB_PATH"
          "$cmdline_bin" --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and test Android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --console=plain

      - name: Architecture check (A01 module dependency gate)
        run: ./gradlew checkArchitecture --no-daemon --console=plain

      # M6：客户端架构门禁 + 热点棘轮。此前 :core:testing 被 include 进 settings，但
      # 没有任何模块依赖它、CI 也从不调用它的 test 任务，于是 A01 的类级 ArchUnit 规则
      # **从未在 CI 上执行过**（第三次「门禁不门禁」）。这一步让它真正运行：
      # ArchUnit 规则 + ClientHotspotRatchetTest（热点行数 / UI 直连持久层次数，精确相等棘轮）。
      - name: Client architecture gate and hotspot ratchet (A01/M6)
        run: ./gradlew :core:testing:test --no-daemon --console=plain

      - name: Navigation registration check (P08 route gate)
        run: python3 scripts/check-nav-registration.py

      - name: App update release gates check (P09)
        run: python3 scripts/check-app-update-gates.py

      - name: Lint check (catch common bugs)
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verify release APK dry-run
        run: |
          ./gradlew :app:assembleRelease :app:verifyReleaseSize \
            -PMAODOU_RELEASE_API_BASE_URL=https://ci.invalid \
            -PMAODOU_RELEASE_WS_URL=wss://ci.invalid/ws \
            --no-daemon --console=plain

      - name: Verify debug APK with aapt2 (manifest/resources parse + icon)
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          test -n "$AAPT2"
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/badging.txt
          grep -E "^package:|^application-label:|^application-icon-[0-9]+:" /tmp/badging.txt | head -8
          grep -q "^package: name='com.maodouchat'" /tmp/badging.txt
          grep -q "application-icon" /tmp/badging.txt

  # Q02/Q03：Room 迁移 / 级联 / 终端竞态这 4 个仪器测试此前**从未被任何自动化执行**——
  # 清单曾声称「CI 仪器测试执行」，实际两个 workflow 都没有 androidTest 任务（实测 0 命中）。
  # 第一次真的跑起来时 AppDatabaseMigrationTest 就是红的。这个 job 让它们无法再悄悄失效。
  instrumented:
    name: Android Instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # 不再使用 android-actions/setup-android@v4：该 action 的引导会执行
        # `sdkmanager tools`，而 Google 已把 legacy `tools` 包移出主 channel，于是它在
        # 「Set up Android SDK」阶段就直接退出：`Warning: Failed to find package 'tools'`
        # → sdkmanager exit 1。两个 Android job 因此都在任何编译之前失败
        # （2026-09-15 run 34914731652 的 attempt 1 与 attempt 2 均实测复现；
        # attempt 2 在 16 秒内失败，失败步骤就是这一条）。
        # ubuntu-latest 镜像本身已预装 cmdline-tools 与 platform-tools，这里只做
        # 定位与导出，后续步骤继续直接用 `sdkmanager`（不再依赖任何第三方 action）。
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "Android SDK root not found: $sdk_root" >&2; exit 1; }
          cmdline_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n1 || true)"
          if [ -z "$cmdline_bin" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            find "$sdk_root" -maxdepth 2 -type d >&2 || true
            exit 1
          fi
          {
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_HOME=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$(dirname "$cmdline_bin")"
            echo "$sdk_root/platform-tools"
          } >> "$GITHUB_PATH"
          "$cmdline_bin" --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # GitHub 的 Linux runner 是 x86_64。app 的 defaultConfig 只打包 arm64-v8a，
      # debug 变体已显式放开 x86_64（依赖 AAR 四种 ABI 都提供）。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # G23：主套件跑完后，**在同一个模拟器生命周期内**再跑真客户端 ↔ 真服务端的 E2E
          # （脚本自己起一台真服务端并注入 10.0.2.2 地址；emulator-runner 之外的步骤里模拟器已被关掉，
          # 所以必须串在这里）。
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
            # 主套件的结果先另存一份：下面的 E2E 会写同一个目录，若不另存，
            # 上传的主套件工件就只反映 E2E 的 4 个用例，55 个用例的证据会丢。
            rm -rf app/build/outputs/androidTest-results-main
            cp -r app/build/outputs/androidTest-results app/build/outputs/androidTest-results-main
            bash scripts/two-device-http-e2e.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results-main
          if-no-files-found: ignore

      # G23：E2E 自己的结果与服务端日志单独上传，便于逐用例核对与失败诊断。
      - name: Upload two-device HTTP E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: two-device-http-e2e
          path: |
            build/e2e-http-results
            build/e2e-two-device-server.log
            build/e2e-two-device-gradle.log
          if-no-files-found: warn

  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.docker.example config

      - name: Validate selfhost Compose config (release-shipped artifact)
        # 9.245：自部署套件随 Release 分发到用户手里，语法/变量错误只能在用户
        # 部署时才暴露——CI 预先用示例变量验证（与主 compose 同等待遇）
        run: docker compose -f deploy/docker-compose.selfhost.yml --env-file .env.docker.example config

      - name: Verify production network isolation
        run: |
          docker compose --env-file .env.docker.example config --format json > /tmp/maodouchat-compose.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/maodouchat-compose.json', encoding='utf-8'))
          services = data['services']
          assert not services['server'].get('ports'), 'Ktor must not publish a host port'
          assert services['server']['environment']['TRUST_PROXY_HEADERS'] == 'true'
          assert services['server']['read_only'] is True
          assert 'ALL' in services['server']['cap_drop']
          assert services['server'].get('healthcheck'), 'Ktor readiness healthcheck is required'
          assert services['proxy']['depends_on']['server']['condition'] == 'service_healthy'
          assert set(services['server']['networks']) == {'edge', 'data'}
          assert set(services['db']['networks']) == {'data'}
          assert set(services['turn']['networks']) == {'turn_net'}
          assert data['networks']['data']['internal'] is True
          published = {(str(p['published']), p['protocol']) for p in services['proxy']['ports']}
          assert ('443', 'tcp') in published and ('443', 'udp') in published
          PY

      - name: Validate production maintenance scripts
        run: bash -n scripts/backup-production.sh scripts/restore-production.sh scripts/rehearse-pg-restore.sh scripts/deploy.sh scripts/update.sh

      - name: Validate Caddy HTTPS proxy config
        run: |
          docker run --rm \
            -e PUBLIC_HOST=api.example.com \
            -e ACME_EMAIL=admin@example.com \
            -e ADMIN_PATH=admin-ci-secret \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
