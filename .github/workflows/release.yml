name: Release

# 打 tag（v*）自动构建并发布 GitHub Release；也可手动触发（workflow_dispatch）。
# 需要的仓库 Secrets：
#   RELEASE_API_BASE_URL / RELEASE_WS_URL  发布版 App 指向的服务端地址（https/wss）
#   KEYSTORE_BASE64                         签名用的 .jks 文件 base64（**必配**：缺失时 "Decode signing keystore" 步骤 `exit 1`，发布直接失败，不会产出未签名 APK）
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD  签名证书信息
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.2.3）。留空：打 tag 用 tag，手动触发用最近 tag'
        required: false
        default: ''
      version_code:
        description: 'Android versionCode 整数。留空：用 git 提交数自动推导'
        required: false
        default: ''
      api_base_url:
        description: '发布版 API 地址，如 https://chat.example.com（覆盖 secret）'
        required: false
        default: ''
      ws_url:
        description: '发布版 WebSocket 地址，如 wss://chat.example.com/ws（覆盖 secret）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # Q06：「Release 必须依赖同 commit 全门禁成功」此前不成立——release.yml 由 tag /
  # workflow_dispatch 独立触发，与 ci.yml 无任何依赖关系（grep workflow_run|needs: → 0 命中），
  # 所以在 CI 已经红的 commit 上打 tag 仍会照常构建并发布。这个 job 把门禁补上。
  verify-ci:
    name: Verify CI green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "查 $REPO 在 $SHA 上的 CI 结论"
          runs=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | {id, status, conclusion, html_url}]')
          echo "$runs" | jq -r '.[] | "run \(.id) status=\(.status) conclusion=\(.conclusion) \(.html_url)"'
          ok=$(echo "$runs" | jq -r '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          if [ "$ok" -eq 0 ]; then
            echo "::error::该 commit 上没有成功的 CI run；拒绝发布。先让 CI 绿再打 tag。"
            exit 1
          fi
          echo "CI 已在该 commit 上成功（$ok 个 run），允许继续发布。"

  release:
    name: Build & publish release
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '0.0.0')"
            fi
            TAG="v$VERSION"
          fi
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi

          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="$(git rev-list --count HEAD)"; fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve API / WebSocket URLs
        id: urls
        run: |
          API="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API" ]; then API="${{ secrets.RELEASE_API_BASE_URL }}"; fi
          if [ -z "$API" ]; then
            API="https://maodouchat.example.com"
            echo "::warning::RELEASE_API_BASE_URL secret/input 未配置，使用占位 https://maodouchat.example.com（App 将连不上真实服务器）"
          fi
          WS="${{ github.event.inputs.ws_url }}"
          if [ -z "$WS" ]; then WS="${{ secrets.RELEASE_WS_URL }}"; fi
          if [ -z "$WS" ]; then
            WS="$(printf '%s' "$API" | sed -E 's#^http(s)?://#wss://#')/ws"
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "keystore=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::KEYSTORE_BASE64 must be configured for a release build" >&2
            exit 1
          fi

      - name: Build & verify Android release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:verifyReleaseSize \
            -PMAODOU_RELEASE_API_BASE_URL="${{ steps.urls.outputs.api }}" \
            -PMAODOU_RELEASE_WS_URL="${{ steps.urls.outputs.ws }}" \
            -PMAODOU_VERSION_NAME="${{ steps.version.outputs.version }}" \
            -PMAODOU_VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            --no-daemon --console=plain

      - name: Build server distribution
        run: |
          chmod +x ./gradlew
          ./gradlew -p server installDist --no-daemon --console=plain

      - name: Package release assets + checksums
        run: |
          mkdir -p release-assets selfhost-kit
          APK_FILE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          cp "$APK_FILE" "release-assets/maodouchat-${{ steps.version.outputs.version }}.apk"
          tar -czf "release-assets/maodouchat-server-${{ steps.version.outputs.version }}.tar.gz" -C server/build/install maodouchat-server
          # 自托管套件：免源码编译的一键部署文件（配合服务端运行包使用）
          cp deploy/docker-compose.selfhost.yml selfhost-kit/docker-compose.yml
          cp deploy/Caddyfile selfhost-kit/Caddyfile
          cp .env.docker.example selfhost-kit/.env.example
          cp docs/self-host-quickstart.md selfhost-kit/README.md
          tar -czf "release-assets/maodouchat-selfhost-${{ steps.version.outputs.version }}.tar.gz" -C selfhost-kit .
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      # G331c：把制品另存为 artifact。
      # 为什么：`release-assets/` 本来是**工作目录本地目录**（上面 mkdir 建的），
      # 而下面「Upload APK to chat server」失败时的恢复指引是「生产恢复后重跑本步骤即可」。
      # 若重跑的 semantics 是「只重跑失败步骤、复用成功步骤产物」，新 runner 的工作区里
      # 不会有 release-assets/，上传步骤会以 `APK missing` 退出 1——**照指引做反而失败**。
      # 存成 artifact 后，无论重跑是整 job 还是只重跑失败步骤，APK 都在手边。
      # 这不是重复发布：Release 资产仍由下面 `Publish GitHub Release` 负责。
      - name: Stash release assets as an artifact (for recovery)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: release-assets/
          retention-days: 30
          if-no-files-found: error

      - name: Generate release notes
        run: |
          PREV_TAG="$(git tag --sort=-version:refname | grep '^v' | sed -n '2p' || true)"
          {
            echo "## Maodouchat v${{ steps.version.outputs.version }}"
            echo ""
            echo "由 GitHub Actions 自动构建（commit \`${GITHUB_SHA:0:7}\`）"
            echo ""
            echo "### 安装包"
            echo "- \`maodouchat-${{ steps.version.outputs.version }}.apk\` — Android 应用（通用包，可连接任意服务器）"
            echo "- \`maodouchat-server-${{ steps.version.outputs.version }}.tar.gz\` — Ktor 服务端运行包（预构建）"
            echo "- \`maodouchat-selfhost-${{ steps.version.outputs.version }}.tar.gz\` — 自托管套件（compose + Caddy + 环境模板）"
            echo "- \`SHA256SUMS.txt\` — 各文件 SHA-256 校验和"
            echo ""
            echo "> 自建服务器：下载服务端运行包 + 自托管套件，按 \`docs/self-host-quickstart.md\` 5 分钟部署；"
            echo "> App 内「设置 → 服务器」填入你的地址即可切换为第三方服务器模式。"
            echo ""
            echo "### 本次变更"
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-decorate "$PREV_TAG..HEAD"
            else
              git log --oneline --no-decorate -30
            fi
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Maodouchat ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/*

      # G331c：把制品从 artifact 取回工作区。
      # 上面的 `Stash release assets as an artifact` 已存一份；这里取回，
      # 于是即使本次 run 的上传失败、日后 `gh run rerun --failed` 只重跑失败步骤，
      # APK 依然在（不必依赖工作目录是否保留）。
      - name: Restore release assets from artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: release-assets/

      - name: Upload APK to chat server
        if: success()
        # G299c：去掉 `continue-on-error: true`。
        # 它把「APK 没送到用户手上」藏成了绿灯——v1.3.0 就是这样：
        # curl 连不上 chat.mdou.me:443（退出 28），步骤仍报 success、
        # 整个 release run success，Release 页面显示发布成功。
        # 而这一步是用户拿到更新的**唯一**通道（GitHub 直链被禁为更新源），
        # 静默失败正是 DIRECTION.md §1 警告的「宣称成立而路径其实没有」。
        env:
          UPDATE_DEPLOY_TOKEN: ${{ secrets.UPDATE_DEPLOY_TOKEN }}
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_DEPLOY_TOKEN" ]; then
            echo "Skip server APK upload (secret UPDATE_DEPLOY_TOKEN not set)"
            exit 0
          fi
          API="${UPDATE_SERVER_URL:-${{ steps.urls.outputs.api }}}"
          API="${API%/}"
          APK="release-assets/maodouchat-${{ steps.version.outputs.version }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK missing: $APK"
            exit 1
          fi
          NOTES="$(tr '\r\n' '  ' < RELEASE_NOTES.md | cut -c1-800)"
          # 三次尝试：瞬时网络抖动不该让整次发布失败，但**持续失败必须红**。
          for attempt in 1 2 3; do
            if curl --fail-with-body -sS -X PUT "${API}/api/internal/app-update" \
              -H "Authorization: Bearer ${UPDATE_DEPLOY_TOKEN}" \
              -H "X-Version-Code: ${{ steps.version.outputs.version_code }}" \
              -H "X-Version-Name: ${{ steps.version.outputs.version }}" \
              -H "X-Update-Notes: ${NOTES}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"${APK}"; then
              echo "APK upload succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::APK upload attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::APK upload failed after 3 attempts — 用户拿不到这次更新。" \
               "制品已在 GitHub Release。生产恢复后两条路（任选）：" \
               "(a) gh run rerun <本 run id> --failed —— 工作流会先从 artifact" \
               "'release-assets-<版本>' 还原 APK，不必重新打 tag；" \
               "(b) 手动：gh release download v<版本> --pattern '*.apk' 拿到制品，" \
               "再 curl -X PUT \"\$UPDATE_SERVER_URL/api/internal/app-update\"" \
               "-H \"Authorization: Bearer \$UPDATE_DEPLOY_TOKEN\"" \
               "-H \"X-Version-Code: <versionCode>\" -H \"X-Version-Name: <版本>\"" \
               "--data-binary @<apk>。详见 docs/app-update-release.md 的『生产不可达时的人工恢复』。"
          exit 1

      - name: Notify Yunhu about release
        if: success()
        continue-on-error: true
        env:
          BOT_SEND_TOKEN_VAR: ${{ vars.YHCHAT_BOT_SEND_TOKEN }}
          BOT_SEND_TOKEN_SECRET: ${{ secrets.YHCHAT_BOT_SEND_TOKEN }}
          BOT_RECV_ID_VAR: ${{ vars.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_ID_SECRET: ${{ secrets.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_TYPE_VAR: ${{ vars.YHCHAT_BOT_RECV_TYPE }}
          BOT_RECV_TYPE_SECRET: ${{ secrets.YHCHAT_BOT_RECV_TYPE }}
        run: |
          BOT_SEND_TOKEN="${BOT_SEND_TOKEN_VAR:-$BOT_SEND_TOKEN_SECRET}"
          BOT_RECV_ID="${BOT_RECV_ID_VAR:-$BOT_RECV_ID_SECRET}"
          BOT_RECV_TYPE="${BOT_RECV_TYPE_VAR:-${BOT_RECV_TYPE_SECRET:-user}}"

          if [ -z "$BOT_SEND_TOKEN" ] || [ -z "$BOT_RECV_ID" ]; then
            echo "Skip Yunhu notify (YHCHAT_BOT_SEND_TOKEN / YHCHAT_BOT_RECV_ID not set)"
            exit 0
          fi

          SEND_URL="https://chat-go.jwzhd.com/open-apis/v1/bot/send?token=${BOT_SEND_TOKEN}"
          UPLOAD_URL="https://chat-go.jwzhd.com/open-apis/v1/file/upload?token=${BOT_SEND_TOKEN}"

          send_markdown() {
            local text="$1"
            local payload
            payload=$(jq -n \
              --arg recvId "$BOT_RECV_ID" \
              --arg recvType "$BOT_RECV_TYPE" \
              --arg text "$text" \
              '{recvId: $recvId, recvType: $recvType, contentType: "markdown", content: {text: $text}}')
            curl --fail-with-body -sS -X POST "$SEND_URL" -H "Content-Type: application/json" -d "$payload"
          }

          # 上传文件拿 fileKey（云湖限制单文件 ≤20MB），再以 file 消息发出
          send_file() {
            local file_path="$1"
            local file_name upload_response file_key payload
            file_name=$(basename "$file_path")
            upload_response=$(curl --fail-with-body -sS \
              -X POST "$UPLOAD_URL" \
              -F "file=@${file_path};filename=${file_name}") || return 1
            file_key=$(printf '%s' "$upload_response" | jq -r '.data.fileKey // empty')
            if [ -z "$file_key" ]; then
              echo "Upload did not return fileKey for ${file_name}"
              return 1
            fi
            payload=$(jq -n \
              --arg recvId "$BOT_RECV_ID" \
              --arg recvType "$BOT_RECV_TYPE" \
              --arg fileKey "$file_key" \
              '{recvId: $recvId, recvType: $recvType, contentType: "file", content: {fileKey: $fileKey}}')
            curl --fail-with-body -sS -X POST "$SEND_URL" -H "Content-Type: application/json" -d "$payload"
          }

          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > build-body.md <<EOF
          ### 🎉 Maodouchat v${VERSION} 发布成功

          **commit**: \`${GITHUB_SHA:0:7}\`
          **触发者**: ${{ github.actor }}
          **构建时间**: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')（北京时间）

          ### 产物
          - APK 安装包（已随本消息发送文件）
          - selfhost 套件（已随本消息发送文件）
          - 服务端包 53MB 超云湖 20MB 上传限制，见下载链接

          ### 链接
          [Release 下载页](${RELEASE_URL}) · [构建详情](${RUN_URL})
          EOF

          if ! send_markdown "$(cat build-body.md)"; then
            echo "Yunhu markdown notification failed"
            exit 0
          fi

          # 直传 ≤20MB 的产物：APK + selfhost 套件
          for f in "release-assets/maodouchat-${VERSION}.apk" "release-assets/maodouchat-selfhost-${VERSION}.tar.gz"; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
              if [ "$SIZE" -lt 20971520 ]; then
                send_file "$f" || echo "Bot file send failed: $f"
              else
                echo "$(basename "$f") is $(($SIZE / 1048576))MB >= 20MB, sent link only"
              fi
            fi
          done

      - name: Notify Yunhu about failure
        if: failure()
        continue-on-error: true
        env:
          BOT_SEND_TOKEN_VAR: ${{ vars.YHCHAT_BOT_SEND_TOKEN }}
          BOT_SEND_TOKEN_SECRET: ${{ secrets.YHCHAT_BOT_SEND_TOKEN }}
          BOT_RECV_ID_VAR: ${{ vars.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_ID_SECRET: ${{ secrets.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_TYPE_VAR: ${{ vars.YHCHAT_BOT_RECV_TYPE }}
          BOT_RECV_TYPE_SECRET: ${{ secrets.YHCHAT_BOT_RECV_TYPE }}
        run: |
          BOT_SEND_TOKEN="${BOT_SEND_TOKEN_VAR:-$BOT_SEND_TOKEN_SECRET}"
          BOT_RECV_ID="${BOT_RECV_ID_VAR:-$BOT_RECV_ID_SECRET}"
          BOT_RECV_TYPE="${BOT_RECV_TYPE_VAR:-${BOT_RECV_TYPE_SECRET:-user}}"

          if [ -z "$BOT_SEND_TOKEN" ] || [ -z "$BOT_RECV_ID" ]; then
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(jq -n \
            --arg recvId "$BOT_RECV_ID" \
            --arg recvType "$BOT_RECV_TYPE" \
            --arg text "### ❌ Maodouchat Release 构建失败\n\n**版本**: ${{ steps.version.outputs.version || github.ref_name }}\n\n[查看失败日志](${RUN_URL})" \
            '{recvId: $recvId, recvType: $recvType, contentType: "markdown", content: {text: $text}}')
          curl --fail-with-body -sS -X POST "https://chat-go.jwzhd.com/open-apis/v1/bot/send?token=${BOT_SEND_TOKEN}" \
            -H "Content-Type: application/json" -d "$payload"
