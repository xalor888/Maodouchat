name: Release

# 打 tag（v*）自动构建并发布 GitHub Release；也可手动触发（workflow_dispatch）。
# 需要的仓库 Secrets：
#   RELEASE_API_BASE_URL / RELEASE_WS_URL  发布版 App 指向的服务端地址（https/wss）
#   KEYSTORE_BASE64                         签名用的 .jks 文件 base64（可不配，但会发布无法安装的未签名 APK）
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD  签名证书信息
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.2.3）。留空：打 tag 用 tag，手动触发用最近 tag'
        required: false
        default: ''
      version_code:
        description: 'Android versionCode 整数。留空：用 git 提交数自动推导'
        required: false
        default: ''
      api_base_url:
        description: '发布版 API 地址，如 https://chat.example.com（覆盖 secret）'
        required: false
        default: ''
      ws_url:
        description: '发布版 WebSocket 地址，如 wss://chat.example.com/ws（覆盖 secret）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '0.0.0')"
            fi
            TAG="v$VERSION"
          fi
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi

          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="$(git rev-list --count HEAD)"; fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve API / WebSocket URLs
        id: urls
        run: |
          API="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API" ]; then API="${{ secrets.RELEASE_API_BASE_URL }}"; fi
          if [ -z "$API" ]; then
            API="https://maodouchat.example.com"
            echo "::warning::RELEASE_API_BASE_URL secret/input 未配置，使用占位 https://maodouchat.example.com（App 将连不上真实服务器）"
          fi
          WS="${{ github.event.inputs.ws_url }}"
          if [ -z "$WS" ]; then WS="${{ secrets.RELEASE_WS_URL }}"; fi
          if [ -z "$WS" ]; then
            WS="$(printf '%s' "$API" | sed -E 's#^http(s)?://#wss://#')/ws"
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "keystore=1" >> "$GITHUB_OUTPUT"
          else
            # 未配置生产签名密钥：生成临时 debug 签名，保证 APK 可安装（非生产签名）。
            # 否则 Android 拒绝安装未签名 APK，报「解析包时出现问题」。
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Maodouchat Debug, OU=Maodouchat, O=Maodouchat, L=City, ST=State, C=CN" >/dev/null 2>&1
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "::warning::Secret KEYSTORE_BASE64 未配置——使用临时 debug 签名（APK 可安装，但非生产签名）"
          fi

      - name: Build & verify Android release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:verifyReleaseSize \
            -PMAODOU_RELEASE_API_BASE_URL="${{ steps.urls.outputs.api }}" \
            -PMAODOU_RELEASE_WS_URL="${{ steps.urls.outputs.ws }}" \
            -PMAODOU_VERSION_NAME="${{ steps.version.outputs.version }}" \
            -PMAODOU_VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            --no-daemon --console=plain

      - name: Build server distribution
        run: |
          chmod +x ./gradlew
          ./gradlew -p server installDist --no-daemon --console=plain

      - name: Package release assets + checksums
        run: |
          mkdir -p release-assets selfhost-kit
          APK_FILE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          cp "$APK_FILE" "release-assets/maodouchat-${{ steps.version.outputs.version }}.apk"
          tar -czf "release-assets/maodouchat-server-${{ steps.version.outputs.version }}.tar.gz" -C server/build/install maodouchat-server
          # 自托管套件：免源码编译的一键部署文件（配合服务端运行包使用）
          cp deploy/docker-compose.selfhost.yml selfhost-kit/docker-compose.yml
          cp deploy/Caddyfile selfhost-kit/Caddyfile
          cp .env.docker.example selfhost-kit/.env.example
          cp docs/self-host-quickstart.md selfhost-kit/README.md
          tar -czf "release-assets/maodouchat-selfhost-${{ steps.version.outputs.version }}.tar.gz" -C selfhost-kit .
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Generate release notes
        run: |
          PREV_TAG="$(git tag --sort=-version:refname | grep '^v' | sed -n '2p' || true)"
          {
            echo "## Maodouchat v${{ steps.version.outputs.version }}"
            echo ""
            echo "由 GitHub Actions 自动构建（commit \`${GITHUB_SHA:0:7}\`）"
            echo ""
            echo "### 安装包"
            echo "- \`maodouchat-${{ steps.version.outputs.version }}.apk\` — Android 应用（通用包，可连接任意服务器）"
            echo "- \`maodouchat-server-${{ steps.version.outputs.version }}.tar.gz\` — Ktor 服务端运行包（预构建）"
            echo "- \`maodouchat-selfhost-${{ steps.version.outputs.version }}.tar.gz\` — 自托管套件（compose + Caddy + 环境模板）"
            echo "- \`SHA256SUMS.txt\` — 各文件 SHA-256 校验和"
            echo ""
            echo "> 自建服务器：下载服务端运行包 + 自托管套件，按 \`docs/self-host-quickstart.md\` 5 分钟部署；"
            echo "> App 内「设置 → 服务器」填入你的地址即可切换为第三方服务器模式。"
            echo ""
            echo "### 本次变更"
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-decorate "$PREV_TAG..HEAD"
            else
              git log --oneline --no-decorate -30
            fi
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Maodouchat ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/*
