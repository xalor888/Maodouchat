<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="/admin-assets/logo.png"/>
<title>毛豆聊天管理后台</title>
<script src="/admin-assets/admin-theme.js?v=21"></script>
<link rel="stylesheet" href="/admin-assets/admin.css?v=21"/>
</head>
<body>

<section id="login" class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img class="login-logo" src="/admin-assets/logo.png" alt="毛豆聊天"/>
      <div>
        <div class="login-title" id="login-brand-name">毛豆聊天</div>
        <div class="login-subtitle">运营控制台</div>
      </div>
    </div>
    <form id="login-form" class="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="username" placeholder="主管理员邮箱" required/>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
      </div>
      <div class="field hidden" id="totp-field">
        <label for="totp-code">动态验证码</label>
        <input id="totp-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" maxlength="8"/>
      </div>
      <button class="btn btn-primary btn-block" type="submit">
        <span id="login-btn-label">登录</span>
      </button>
      <div id="login-error" class="login-error" role="alert"></div>
      <div class="login-hint">使用主管理员账号登录（MASTER_ADMINS 配的是用户 ID，登录仍填该账号邮箱和密码）。开启两步验证时会再要 TOTP。</div>
    </form>
  </div>
</section>

<section id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" src="/admin-assets/logo.png" alt="毛豆聊天"/>
      <span class="sidebar-title" id="admin-server-name">毛豆聊天后台</span>
    </div>
    <nav class="sidebar-nav" id="nav">
      <div class="nav-group">
        <div class="nav-group-label">日常</div>
        <button data-tab="dashboard" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
          <span>总览</span>
        </button>
        <button data-tab="users" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 19c.7-3.2 3.3-5 6.5-5s5.8 1.8 6.5 5"/></svg>
          <span>用户</span>
        </button>
        <button data-tab="online" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.25"/><path d="M8.2 8.2a5.4 5.4 0 000 7.6M15.8 8.2a5.4 5.4 0 010 7.6M5.5 5.5a9.2 9.2 0 000 13M18.5 5.5a9.2 9.2 0 010 13"/></svg>
          <span>在线</span>
          <span class="nav-badge hidden" id="nav-online-badge">0</span>
        </button>
        <button data-tab="ranking" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V5M19 19v-7"/></svg>
          <span>排行</span>
        </button>
        <button data-tab="content" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5A2.5 2.5 0 017.5 4h9A2.5 2.5 0 0119 6.5v7A2.5 2.5 0 0116.5 16H11l-4 3.5V16H7.5A2.5 2.5 0 015 13.5v-7z"/></svg>
          <span>内容</span>
        </button>
        <button data-tab="moderation" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5h8.5A1.5 1.5 0 0118 6v13.5l-6-2.2-6 2.2V6A1.5 1.5 0 017.5 4.5H8z"/><path d="M9.5 11.5l1.8 1.8 3.4-3.6"/></svg>
          <span>审核</span>
          <span class="nav-badge hidden" id="nav-reports-badge">0</span>
        </button>
        <button data-tab="risk" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l7.5 3v5.2c0 4.3-3 7.4-7.5 8.8-4.5-1.4-7.5-4.5-7.5-8.8V6.5l7.5-3z"/><path d="M12 8.5v4M12 15.5h.01"/></svg>
          <span>风控</span>
          <span class="nav-badge nav-badge-warn hidden" id="nav-risk-badge">0</span>
        </button>
        <button data-tab="announcements" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10v4h2.2L11 17.8V6.2L6.7 10H4.5z"/><path d="M16.2 8.4a4.2 4.2 0 010 7.2M18.8 6.2a7.2 7.2 0 010 11.6"/></svg>
          <span>公告</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">配置</div>
        <button data-tab="system" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3.8v2.2M12 18v2.2M4.9 6.5l1.6 1.6M17.5 16l1.6 1.6M3.8 12h2.2M18 12h2.2M4.9 17.5l1.6-1.6M17.5 8.1l1.6-1.6"/></svg>
          <span>系统</span>
        </button>
        <button data-tab="diagnostics" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.5l3.5-3.5 3 3L14 9.5l3 3 3-3"/><path d="M4 19h16"/></svg>
          <span>诊断</span>
        </button>
        <button data-tab="audit" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5h6.2L19 9.2V19a1.5 1.5 0 01-1.5 1.5h-9.5A1.5 1.5 0 016.5 19V6A1.5 1.5 0 018 4.5z"/><path d="M14 4.5V9h4.5M9 13h6M9 16.5h4"/></svg>
          <span>审计</span>
        </button>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="session-badge" id="session-info" title="高权限会话剩余时间">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.25"/><path d="M12 7.5V12l3 1.8"/></svg>
        <span>--:--</span>
      </div>
      <button id="logout" class="btn btn-ghost btn-sm">退出</button>
    </div>
  </aside>

  <div class="sidebar-overlay hidden" id="sidebar-overlay"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="topbar-menu btn btn-ghost btn-icon" id="menu-toggle">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      </button>
      <h1 class="topbar-title" id="page-title">总览</h1>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-icon" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
          <svg id="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg id="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="refresh-btn">刷新</button>
      </div>
    </header>
    <main class="content" id="content">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>加载中…</span>
      </div>
    </main>
  </div>
</section>

<div id="toast" class="toast hidden" role="status">
  <svg class="toast-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.25"/><path d="M8.2 12.2l2.4 2.4 5.2-5.3"/></svg>
  <span class="toast-text"></span>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" id="modal-box">
    <div class="modal-icon" id="modal-icon-wrap"></div>
    <h3 class="modal-title" id="modal-title"></h3>
    <p class="modal-body" id="modal-body"></p>
    <div class="modal-input-wrap hidden" id="modal-input-wrap">
      <input type="text" class="modal-input" id="modal-input" placeholder=""/>
      <div class="modal-input-hint" id="modal-input-hint"></div>
    </div>
    <div class="modal-select-wrap hidden" id="modal-select-wrap">
      <select class="modal-select" id="modal-select"></select>
    </div>
    <div class="modal-form-wrap hidden" id="modal-form-wrap"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-confirm">确认</button>
    </div>
  </div>
</div>

<div id="drawer-overlay" class="drawer-overlay hidden">
  <div class="drawer" id="drawer-box">
    <div class="drawer-header">
      <h3 id="drawer-title">详情</h3>
      <button class="btn btn-ghost btn-icon" id="drawer-close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<script src="/admin-assets/admin.js?v=21" defer></script>
<script src="/admin-assets/admin-branding.js?v=21" defer></script>
</body>
</html>
