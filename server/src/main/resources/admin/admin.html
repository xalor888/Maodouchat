<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="/admin-assets/logo.png"/>
<title>毛豆聊天管理后台</title>
<script src="/admin-assets/admin-theme.js"></script>
<link rel="stylesheet" href="/admin-assets/admin.css"/>
</head>
<body>

<section id="login" class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img class="login-logo" src="/admin-assets/logo.png" alt="毛豆聊天"/>
      <div>
        <div class="login-title" id="login-brand-name">毛豆聊天</div>
        <div class="login-subtitle">运营控制台</div>
      </div>
    </div>
    <form id="login-form" class="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="username" placeholder="主管理员邮箱" required/>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
      </div>
      <div class="field hidden" id="totp-field">
        <label for="totp-code">动态验证码</label>
        <input id="totp-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" maxlength="8"/>
      </div>
      <button class="btn btn-primary btn-block" type="submit">
        <span id="login-btn-label">登录</span>
      </button>
      <div id="login-error" class="login-error" role="alert"></div>
      <div class="login-hint">使用 MASTER_ADMINS 里配置的主管理员账号。开启两步验证时会再要 TOTP。</div>
    </form>
  </div>
</section>

<section id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" src="/admin-assets/logo.png" alt="毛豆聊天"/>
      <span class="sidebar-title" id="admin-server-name">毛豆聊天后台</span>
    </div>
    <nav class="sidebar-nav" id="nav">
      <div class="nav-group">
        <div class="nav-group-label">日常</div>
        <button data-tab="dashboard" class="nav-item active">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v6H2V2zm7 0h5v3H9V2zm0 5h5v7H9V7zM2 10h5v4H2v-4z"/></svg>
          <span>总览</span>
        </button>
        <button data-tab="users" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM3 12c0-2 2.2-3.5 5-3.5s5 1.5 5 3.5v1H3v-1z"/></svg>
          <span>用户</span>
          <span class="nav-badge hidden" id="nav-online-badge">0</span>
        </button>
        <button data-tab="content" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3a1 1 0 011-1h10a1 1 0 011 1v7a1 1 0 01-1 1H7l-3 3v-3H3a1 1 0 01-1-1V3z"/></svg>
          <span>内容</span>
        </button>
        <button data-tab="moderation" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 14h14L8 1zm0 4v4H7V5h1zm0 6v1H7v-1h1z"/></svg>
          <span>审核</span>
          <span class="nav-badge hidden" id="nav-reports-badge">0</span>
        </button>
        <button data-tab="announcements" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a3 3 0 00-3 3v4.5L3 10.5V12h10v-1.5l-2-2V4a3 3 0 00-3-3zm-2 12a2 2 0 004 0H6z"/></svg>
          <span>公告</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">配置</div>
        <button data-tab="system" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 2a1 1 0 00-1 1v1H4a1 1 0 00-1 1v1h10V5a1 1 0 00-1-1h-1V3a1 1 0 00-1-1H6zm1 3h2v1H7V5zM3 8h10v1H3V8zm1 3h8a1 1 0 001-1H2a1 1 0 001 1z"/></svg>
          <span>系统</span>
        </button>
        <button data-tab="diagnostics" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 12h3v2H2v-2zm5-4h3v6H7V8zm5-6h3v12h-3V2z"/></svg>
          <span>诊断</span>
          <span class="nav-badge nav-badge-warn hidden" id="nav-risk-badge">0</span>
        </button>
        <button data-tab="audit" class="nav-item">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V4l-3-3H4zm4 3V2l2 2H8z"/></svg>
          <span>审计</span>
        </button>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="session-badge" id="session-info" title="高权限会话剩余时间">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 1a7 7 0 100 14 7 7 0 000-14zm0 2v5l3 2"/></svg>
        <span>--:--</span>
      </div>
      <button id="logout" class="btn btn-ghost btn-sm">退出</button>
    </div>
  </aside>

  <div class="sidebar-overlay hidden" id="sidebar-overlay"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="topbar-menu btn btn-ghost btn-icon" id="menu-toggle">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor"><path d="M2 3h12v1.5H2V3zm0 4h12v1.5H2V7zm0 4h12v1.5H2V11z"/></svg>
      </button>
      <h1 class="topbar-title" id="page-title">总览</h1>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-icon" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
          <svg id="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg id="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="refresh-btn">刷新</button>
      </div>
    </header>
    <main class="content" id="content">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>加载中…</span>
      </div>
    </main>
  </div>
</section>

<div id="toast" class="toast hidden" role="status">
  <svg class="toast-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 1a7 7 0 100 14 7 7 0 000-14zm3.5 5.5L7 11 4.5 8.5l1-1L7 9l3.5-3.5 1 1z"/></svg>
  <span class="toast-text"></span>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" id="modal-box">
    <div class="modal-icon" id="modal-icon-wrap"></div>
    <h3 class="modal-title" id="modal-title"></h3>
    <p class="modal-body" id="modal-body"></p>
    <div class="modal-input-wrap hidden" id="modal-input-wrap">
      <input type="text" class="modal-input" id="modal-input" placeholder=""/>
      <div class="modal-input-hint" id="modal-input-hint"></div>
    </div>
    <div class="modal-select-wrap hidden" id="modal-select-wrap">
      <select class="modal-select" id="modal-select"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-confirm">确认</button>
    </div>
  </div>
</div>

<div id="drawer-overlay" class="drawer-overlay hidden">
  <div class="drawer" id="drawer-box">
    <div class="drawer-header">
      <h3 id="drawer-title">详情</h3>
      <button class="btn btn-ghost btn-icon" id="drawer-close">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<script src="/admin-assets/admin.js" defer></script>
<script src="/admin-assets/admin-branding.js" defer></script>
</body>
</html>
