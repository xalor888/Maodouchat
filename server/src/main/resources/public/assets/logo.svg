<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="maodouGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D64F2" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Outer M Shape: 1:1 perfect proportions (460x460 bounding box in 512x512) -->
  <path d="M 46 170
           C 46 75, 95 30, 172 30
           C 215 30, 240 70, 256 120
           C 272 70, 297 30, 340 30
           C 417 30, 466 75, 466 170
           L 466 342
           C 466 437, 417 482, 340 482
           L 172 482
           C 95 482, 46 437, 46 342
           Z" 
        fill="url(#maodouGrad)" />

  <!-- Inner Solid White Bean Pod (毛豆) Chat Bubble -->
  <path d="M 185 240
           C 135 240, 110 270, 110 320
           C 110 375, 140 400, 168 400
           C 168 400, 162 438, 154 456
           C 178 440, 212 400, 222 400
           C 236 400, 246 386, 256 386
           C 266 386, 276 400, 290 400
           C 318 400, 402 375, 402 320
           C 402 265, 318 240, 290 240
           C 276 240, 266 254, 256 254
           C 246 254, 236 240, 222 240
           Z"
        fill="#FFFFFF" />

  <!-- 3 Inner Dots -->
  <circle cx="188" cy="325" r="20" fill="url(#dotGrad)" />
  <circle cx="256" cy="325" r="20" fill="url(#dotGrad)" />
  <circle cx="324" cy="325" r="20" fill="url(#dotGrad)" />
</svg>