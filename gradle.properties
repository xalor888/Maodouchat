org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Do not set org.gradle.java.home here - it breaks Linux Docker builds.
# For local Windows, set JAVA_HOME or put java.home in ~/.gradle/gradle.properties.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
# 更激进的资源缩减（移除未引用资源）
android.enableNewResourceShrinking=true
# 非 final 资源 ID -> 减少 R 类字段数
android.nonFinalResIds=true
# R8 完全模式：更激进的代码缩减和优化，减少 ~5-10% dex 体积
android.enableR8.fullMode=true
# Gradle 构建缓存：加速 CI 和本地增量构建
org.gradle.caching=true
# 并行构建：多模块并行编译
org.gradle.parallel=true
# B1 体积护栏：Release APK 体积基线（字节，14MB）。:app:verifyReleaseSize 校验超限即失败（阻断发版）；
# 可 -PMAODOU_SIZE_BASELINE_BYTES=<bytes> 临时覆盖（例如发布前手动放行）。
MAODOU_SIZE_BASELINE_BYTES=14680064

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
